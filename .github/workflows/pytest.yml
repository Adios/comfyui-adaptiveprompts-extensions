name: Pytest Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout extension repository
      uses: actions/checkout@v4
      with:
        path: comfyui-adaptiveprompts-extensions

    - name: Checkout mother repository
      uses: actions/checkout@v4
      with:
        repository: Alectriciti/comfyui-adaptiveprompts
        path: comfyui-adaptiveprompts

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      working-directory: ./comfyui-adaptiveprompts-extensions
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run tests
      working-directory: ./comfyui-adaptiveprompts-extensions
      run: |
        pytest tests/ -v
